<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C/M 10 — Design Styles</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  body{user-select:none}
  .stage{position:relative;width:100vw;height:100vh;background:#111;overflow:hidden;cursor:default}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.012);filter:blur(2px) saturate(.96);pointer-events:none;will-change:opacity,transform,filter}
  .slide.active{opacity:1;transform:scale(1);filter:none;pointer-events:auto}
  .slide.incoming{animation:underReveal 1.2s cubic-bezier(.2,.72,.18,1) both}
  @keyframes underReveal{
    0%{opacity:.6;transform:scale(1.022);filter:blur(8px) saturate(.84) brightness(.86)}
    52%{opacity:.9;filter:blur(2.5px) saturate(.94) brightness(.95)}
    100%{opacity:1;transform:scale(1);filter:blur(0) saturate(1) brightness(1)}
  }
  .roll-layer{position:absolute;inset:0;z-index:18;pointer-events:none;background-repeat:no-repeat;background-position:center;
              will-change:clip-path,transform,opacity,filter;transform-origin:left center;
              animation:rollAway3D 1.78s cubic-bezier(.2,.72,.16,1) forwards;
              filter:drop-shadow(18px 0 22px rgba(0,0,0,.24))}
  .roll-layer::before{content:"";position:absolute;inset:0;
              background:linear-gradient(90deg,rgba(0,0,0,.02) 0%,rgba(255,255,255,.03) 28%,rgba(0,0,0,.08) 70%,rgba(255,255,255,.16) 94%,rgba(255,255,255,.34) 100%);
              mix-blend-mode:soft-light}
  .roll-layer::after{content:"";position:absolute;top:0;right:-2px;height:100%;width:clamp(34px,5.6vw,78px);
              background:linear-gradient(90deg,rgba(24,18,12,.26) 0%,rgba(255,255,255,.18) 13%,rgba(255,255,255,.68) 30%,rgba(72,52,28,.34) 52%,rgba(255,255,255,.9) 72%,rgba(255,255,255,.22) 88%,rgba(0,0,0,.18) 100%);
              border-radius:48% 0 0 48% / 50% 0 0 50%;
              box-shadow:-18px 0 26px rgba(0,0,0,.34),-5px 0 10px rgba(0,0,0,.22),inset 12px 0 16px rgba(255,255,255,.36),inset -9px 0 16px rgba(0,0,0,.25)}
  .roll-cylinder{position:absolute;top:-1.5%;right:-2.3vw;height:103%;width:clamp(44px,6.5vw,92px);z-index:21;pointer-events:none;
              border-radius:50% / 48%;opacity:0;
              background:linear-gradient(90deg,rgba(35,27,17,.72) 0%,rgba(255,255,255,.24) 14%,rgba(255,255,255,.88) 34%,rgba(118,86,47,.4) 52%,rgba(255,255,255,.94) 69%,rgba(255,255,255,.28) 84%,rgba(30,22,14,.55) 100%);
              box-shadow:-24px 0 36px rgba(0,0,0,.38),0 12px 34px rgba(0,0,0,.3),inset 13px 0 18px rgba(255,255,255,.38),inset -11px 0 18px rgba(0,0,0,.28);
              animation:cylinderSweep 1.78s cubic-bezier(.2,.72,.16,1) forwards}
  .roll-cylinder::after{content:"";position:absolute;inset:3% 16%;border-radius:50%;
              background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.52) 40%,rgba(255,255,255,.08) 72%);filter:blur(5px);opacity:.75}
  .roll-shadow{position:absolute;left:2%;right:2%;bottom:-2.2%;height:7%;z-index:17;pointer-events:none;opacity:0;
              background:radial-gradient(ellipse at center,rgba(0,0,0,.42) 0%,rgba(0,0,0,.2) 38%,rgba(0,0,0,0) 75%);
              filter:blur(10px);animation:floorShadow 1.78s ease-out forwards}
  @keyframes rollAway3D{
    0%{opacity:1;clip-path:inset(0 0 0 0);transform:perspective(1200px) translateZ(0) rotateY(0deg) scaleX(1);filter:brightness(1) saturate(1)}
    12%{opacity:1;clip-path:inset(0 5% 0 0 round 0 12px 12px 0);transform:perspective(1200px) translateZ(8px) rotateY(4deg) scaleX(.995)}
    30%{opacity:1;clip-path:inset(0 20% 0 0 round 0 18px 18px 0);transform:perspective(1200px) translateZ(16px) rotateY(14deg) scaleX(.95);filter:brightness(1.04)}
    52%{opacity:1;clip-path:inset(0 46% 0 0 round 0 26px 26px 0);transform:perspective(1200px) translateZ(26px) rotateY(34deg) scaleX(.8);filter:brightness(1.01)}
    76%{opacity:.98;clip-path:inset(0 76% 0 0 round 0 36px 36px 0);transform:perspective(1200px) translateZ(36px) rotateY(62deg) scaleX(.48);filter:brightness(.95) saturate(.96)}
    100%{opacity:0;clip-path:inset(0 98.8% 0 0 round 0 42px 42px 0);transform:perspective(1200px) translateZ(48px) rotateY(88deg) scaleX(.055) translateX(-2%);filter:brightness(.86) saturate(.88)}
  }
  @keyframes cylinderSweep{
    0%{opacity:0;transform:translateX(0) scaleX(.72) rotateY(0deg)}
    10%{opacity:.92;transform:translateX(-4vw) scaleX(.92) rotateY(8deg)}
    28%{opacity:1;transform:translateX(-19vw) scaleX(1.04) rotateY(18deg)}
    52%{opacity:1;transform:translateX(-45vw) scaleX(1.14) rotateY(30deg)}
    76%{opacity:.96;transform:translateX(-76vw) scaleX(1.02) rotateY(45deg)}
    100%{opacity:0;transform:translateX(-101vw) scaleX(.7) rotateY(70deg)}
  }
  @keyframes floorShadow{
    0%{opacity:0;transform:scaleX(.35) translateX(42%)}
    18%{opacity:.42;transform:scaleX(.55) translateX(26%)}
    55%{opacity:.5;transform:scaleX(.72) translateX(0)}
    100%{opacity:0;transform:scaleX(.35) translateX(-45%)}
  }
  .reveal-sheen{position:absolute;inset:-10%;z-index:14;pointer-events:none;opacity:0;
                background:linear-gradient(102deg,rgba(255,255,255,0) 24%,rgba(255,255,255,.08) 44%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.04) 56%,rgba(255,255,255,0) 76%);
                mix-blend-mode:screen;animation:sheenPass 1.1s ease-out forwards}
  @keyframes sheenPass{0%{opacity:0;transform:translateX(-12%) scale(1.02)}30%{opacity:.45}100%{opacity:0;transform:translateX(11%) scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .slide,.slide.incoming{animation:none!important;transition:opacity .55s ease!important;transform:none!important;filter:none!important}
    .roll-layer,.roll-cylinder,.roll-shadow,.reveal-sheen{display:none!important}
  }

  .backdrop{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:blur(24px) brightness(.55) saturate(.95);transform:scale(1.06)}
  .backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.02) 35%,rgba(0,0,0,.10))}
  .hero{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 8px 28px rgba(0,0,0,.35))}
  .plan-card{position:absolute;left:2.1vw;bottom:2.4vh;width:min(27vw,390px);max-height:43vh;padding:10px;background:rgba(255,255,255,.94);
              border:1px solid rgba(255,255,255,.78);box-shadow:0 14px 38px rgba(0,0,0,.32);backdrop-filter:blur(6px);z-index:20}
  .plan-card img{display:block;width:100%;height:auto;max-height:40vh;object-fit:contain}
  .style-name{position:absolute;right:2.4vw;bottom:3vh;z-index:22;color:white;background:rgba(0,0,0,.43);
               border:1px solid rgba(255,255,255,.28);padding:10px 16px;letter-spacing:.08em;font-size:clamp(12px,1.25vw,19px);
               backdrop-filter:blur(8px);transition:opacity .4s ease}
  .brand{position:absolute;right:2.4vw;top:2.4vh;z-index:22;color:white;font-family:Georgia,serif;font-size:clamp(18px,2vw,31px);
          letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.55)}
  .controls{position:absolute;left:50%;transform:translateX(-50%);bottom:3vh;z-index:25;display:flex;align-items:center;gap:10px;
             background:rgba(0,0,0,.34);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px);
             border:1px solid rgba(255,255,255,.16)}
  .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
  .dot.active{width:22px;border-radius:8px;background:#fff}
  .pause-btn{margin-inline-start:5px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.34);
              color:#fff;background:rgba(0,0,0,.18);cursor:pointer;font-size:13px;line-height:26px;text-align:center}
  .music-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.34);color:#fff;background:rgba(0,0,0,.18);cursor:pointer;font-size:14px;line-height:28px;text-align:center;transition:.25s}
  .music-btn.on{background:rgba(255,255,255,.18);box-shadow:0 0 18px rgba(255,255,255,.14)}
  .hint{position:absolute;left:50%;transform:translateX(-50%);top:2.5vh;z-index:25;color:rgba(255,255,255,.86);font-size:12px;
         background:rgba(0,0,0,.27);padding:7px 12px;border-radius:20px;backdrop-filter:blur(7px);opacity:.78}
  .paused .hint::after{content:" — מושהה"}
  @media (max-width:760px){
    .plan-card{width:min(42vw,260px);left:12px;bottom:14px;padding:6px}
    .style-name{right:12px;bottom:14px;font-size:11px;padding:8px 10px}
    .controls{bottom:68px}
    .hint{top:10px;font-size:10px}
  }
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="גלריית עיצוב אינטראקטיבית לדירה 4">
  <div class="slide active" data-name="אנגלי קלאסי">
      <div class="backdrop" style="background-image:url('assets/gallery_01.webp')"></div>
      <img class="hero" src="assets/gallery_01.webp" alt="אנגלי קלאסי">
    </div>
<div class="slide" data-name="מודרני שחור וכתום">
      <div class="backdrop" style="background-image:url('assets/gallery_02.webp')"></div>
      <img class="hero" src="assets/gallery_02.webp" alt="מודרני שחור וכתום">
    </div>
<div class="slide" data-name="בארוק כבד">
      <div class="backdrop" style="background-image:url('assets/gallery_03.webp')"></div>
      <img class="hero" src="assets/gallery_03.webp" alt="בארוק כבד">
    </div>
<div class="slide" data-name="צעיר מינימליסטי">
      <div class="backdrop" style="background-image:url('assets/gallery_04.webp')"></div>
      <img class="hero" src="assets/gallery_04.webp" alt="צעיר מינימליסטי">
    </div>
<div class="slide" data-name="בורדו דרמטי ומתכתי">
      <div class="backdrop" style="background-image:url('assets/gallery_05.webp')"></div>
      <img class="hero" src="assets/gallery_05.webp" alt="בורדו דרמטי ומתכתי">
    </div>
  <div class="brand">C/M 10</div>
  <div class="hint">מתחלף כל 5 שניות • עמדי עם העכבר כדי לעצור • לחיצה ראשונה מפעילה מוזיקה עדינה • ♪ להשתקה</div>
  <div class="plan-card" aria-label="שרטוט דירה 4">
    <img src="assets/gallery_06.webp" alt="שרטוט דירה 4 ללא טבלת הכיתוב">
  </div>
  <div class="style-name" id="styleName">אנגלי קלאסי</div>
  <div class="controls">
    <button class="dot active" aria-label="עיצוב 1" data-index="0"></button>
<button class="dot" aria-label="עיצוב 2" data-index="1"></button>
<button class="dot" aria-label="עיצוב 3" data-index="2"></button>
<button class="dot" aria-label="עיצוב 4" data-index="3"></button>
<button class="dot" aria-label="עיצוב 5" data-index="4"></button>
    <button class="pause-btn" id="pauseBtn" aria-label="עצירה או המשך">Ⅱ</button>
    <button class="music-btn" id="musicBtn" aria-label="הפעלת או השתקת מוזיקה" title="מוזיקת רקע">♪</button>
  </div>
</div>
<script>
(() => {
  const stage = document.getElementById('stage');
  const slides = [...document.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('.dot')];
  const label = document.getElementById('styleName');
  const pauseBtn = document.getElementById('pauseBtn');
  const musicBtn = document.getElementById('musicBtn');

  const intervalMs = 5000;
  const transitionMs = 1820;
  let index = 0, timer = null, paused = false, transitioning = false;
  const frameCache = new Map();

  function objectFitContainRect(img, boxW, boxH) {
    const iw = img.naturalWidth || boxW;
    const ih = img.naturalHeight || boxH;
    const scale = Math.min(boxW / iw, boxH / ih);
    const w = iw * scale, h = ih * scale;
    return {x:(boxW-w)/2, y:(boxH-h)/2, w, h};
  }

  function getRenderedFrame(slide) {
    const hero = slide.querySelector('.hero');
    if (!hero || !hero.complete || !hero.naturalWidth) return null;
    const w = Math.max(1, Math.round(stage.clientWidth));
    const h = Math.max(1, Math.round(stage.clientHeight));
    const key = `${hero.src.length}:${hero.src.slice(-48)}:${w}x${h}`;
    if (frameCache.has(key)) return frameCache.get(key);

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const r = objectFitContainRect(hero, w, h);
    ctx.drawImage(hero, r.x, r.y, r.w, r.h);
    const url = canvas.toDataURL('image/webp', .86);
    frameCache.clear();
    frameCache.set(key, url);
    return url;
  }

  function makeRollOverlay(slide) {
    const frame = getRenderedFrame(slide);
    if (!frame) return null;

    const roll = document.createElement('div');
    roll.className = 'roll-layer';
    roll.style.backgroundImage = `url(${frame})`;
    roll.style.backgroundSize = '100% 100%';
    stage.appendChild(roll);

    const cylinder = document.createElement('div');
    cylinder.className = 'roll-cylinder';
    stage.appendChild(cylinder);

    const shadow = document.createElement('div');
    shadow.className = 'roll-shadow';
    stage.appendChild(shadow);

    const sheen = document.createElement('div');
    sheen.className = 'reveal-sheen';
    stage.appendChild(sheen);

    setTimeout(() => { roll.remove(); cylinder.remove(); shadow.remove(); sheen.remove(); }, transitionMs + 150);
    return roll;
  }

  function updateUi() {
    dots.forEach((d, n) => d.classList.toggle('active', n === index));
    label.textContent = slides[index].dataset.name;
  }

  function show(i, animate = true) {
    const next = (i + slides.length) % slides.length;
    if (next === index && slides[index].classList.contains('active')) return;
    if (transitioning) return;

    const current = slides[index];
    const incoming = slides[next];
    transitioning = true;

    if (animate && current?.classList.contains('active')) {
      makeRollOverlay(current);

      incoming.classList.add('active', 'incoming');
      current.classList.remove('active', 'incoming');
      index = next;
      updateUi();

      setTimeout(() => {
        slides.forEach((s, n) => {
          s.classList.remove('incoming');
          s.classList.toggle('active', n === index);
        });
        transitioning = false;
      }, transitionMs);
    } else {
      slides.forEach((s, n) => {
        s.classList.remove('incoming');
        s.classList.toggle('active', n === next);
      });
      index = next;
      updateUi();
      transitioning = false;
    }
  }


  // Gentle generative ambient soundtrack. It uses Web Audio, so no external music file is required.
  let audioCtx = null, masterGain = null, musicEnabled = false, musicStarted = false;
  let chordTimer = null, chordIndex = 0;
  const chords = [
    [261.63, 329.63, 392.00, 493.88], // Cmaj7
    [220.00, 261.63, 329.63, 392.00], // Am7
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [196.00, 246.94, 293.66, 392.00]  // Gsus/add9
  ];

  function playPadChord(freqs) {
    if (!audioCtx || !masterGain || !musicEnabled) return;
    const now = audioCtx.currentTime;
    const duration = 7.4;
    freqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.value = freq / (i === 0 ? 2 : 1);
      osc.detune.value = (i - 1.5) * 2.2;
      filter.type = 'lowpass';
      filter.frequency.value = 980;
      filter.Q.value = .45;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.018 / (i === 0 ? 1.35 : 1), now + 1.7 + i*.08);
      gain.gain.setValueAtTime(0.014, now + 4.8);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(filter).connect(gain).connect(masterGain);
      osc.start(now + i*.04);
      osc.stop(now + duration + .15);
    });
  }

  function scheduleAmbient() {
    clearTimeout(chordTimer);
    if (!musicEnabled) return;
    playPadChord(chords[chordIndex % chords.length]);
    chordIndex++;
    chordTimer = setTimeout(scheduleAmbient, 6100);
  }

  async function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.42;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  }

  async function setMusic(value) {
    musicEnabled = value;
    musicBtn.classList.toggle('on', musicEnabled);
    musicBtn.textContent = musicEnabled ? '♫' : '♪';
    musicBtn.setAttribute('aria-pressed', musicEnabled ? 'true' : 'false');
    if (musicEnabled) {
      await ensureAudio();
      if (!musicStarted) musicStarted = true;
      scheduleAmbient();
    } else {
      clearTimeout(chordTimer);
      if (masterGain && audioCtx) {
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, .18);
        setTimeout(() => { if (masterGain && !musicEnabled) masterGain.gain.value = 0.42; }, 500);
      }
    }
  }

  // Browsers block sound until a user gesture. First click/tap starts the soundtrack softly.
  const armMusicOnFirstGesture = async (e) => {
    if (e.target.closest('.music-btn')) return;
    if (!musicStarted) await setMusic(true);
  };
  stage.addEventListener('pointerdown', armMusicOnFirstGesture, {once:true});
  musicBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await setMusic(!musicEnabled);
  });

  function start() {
    clearInterval(timer);
    if (!paused) timer = setInterval(() => {
      if (!transitioning) show(index + 1, true);
    }, intervalMs);
  }

  function setPaused(value) {
    paused = value;
    stage.classList.toggle('paused', paused);
    pauseBtn.textContent = paused ? '▶' : 'Ⅱ';
    if (paused) clearInterval(timer); else start();
  }

  stage.addEventListener('mouseenter', () => setPaused(true));
  stage.addEventListener('mouseleave', () => setPaused(false));

  pauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setPaused(!paused);
  });

  dots.forEach(d => d.addEventListener('click', e => {
    e.stopPropagation();
    if (!transitioning) show(Number(d.dataset.index), true);
    if (!paused) start();
  }));

  stage.addEventListener('click', e => {
    if (e.target.closest('.controls') || e.target.closest('.plan-card')) return;
    setPaused(!paused);
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
    if (e.key === 'ArrowRight' && !transitioning) { show(index + 1, true); if (!paused) start(); }
    if (e.key === 'ArrowLeft' && !transitioning) { show(index - 1, true); if (!paused) start(); }
  });

  // Rebuild cached transition frame after a resize.
  window.addEventListener('resize', () => frameCache.clear());

  slides.forEach(s => s.classList.remove('active','incoming'));
  index = 0;
  slides[0].classList.add('active');
  updateUi();
  start();
})();
</script>
</body>
</html>
