<template id="page-1"><article class="leaf-page photopage page-2" dir="rtl"><div class="page-content"><div class="photo-layout"><div class="photo-edge"></div><div class="photo-frame"><img alt="הדמיית החזית המערבית בשעת ערב" data-photo="west_evening"/></div><div class="photo-caption"><div class="photo-title-hebrew"><h2>האדריכלות ממשיכה אל הלילה</h2></div><p>קצב של אור, חזית בעלת אופי ותחושה של מקום לחזור אליו.</p><div class="photo-bottom-logo"><svg aria-label="C/M 10" class="cm-logo mini-logo" direction="ltr" height="64" role="img" viewBox="0 0 113 148" width="72" xmlns="http://www.w3.org/2000/svg"><g><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="77" font-weight="400" letter-spacing="-6" x="16" y="77">C</text><path d="M34 113 L77 25" fill="none" stroke="#c59a56" stroke-linecap="square" stroke-width="1.4"></path><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="75" font-weight="400" letter-spacing="-7" x="44" y="118">M</text><text fill="#c59a56" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="19" font-weight="400" x="17" y="133">10</text></g></svg></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>02</span></div></article></template>
<template id="page-2"><article class="leaf-page paper page-3" dir="rtl"><div class="page-content"><div class="editorial manifesto"><div class="eyebrow"><span class="little-line"></span>01 · הרעיון</div><div class="brand-epigraph">כשהעבר מחליט לצעוד אל העתיד, נוצר משהו יוצא דופן.</div><h2 class="display">יש מקומות שרואים.<br/><em>ויש מקומות שמרגישים.</em></h2><p class="lead">מקומות שבהם משהו פשוט מרגיש נכון — הפרופורציות, החומרים, האור, הפרטים הקטנים והאווירה שנוצרת ביניהם.</p><div class="fine-rule"></div><p class="body-copy">מתוך אהבה לאלגנטיות האירופאית של פעם, ומתוך הבנה שהחיים של היום מבקשים הרבה יותר, יצרנו אדריכלות על־זמנית: בניין בוטיק אינטימי בסגנון ניאו־קלאסי, המחבר בין אופי ופרופורציות קלאסיות לבין תכנון עכשווי, טכנולוגיה, נוחות ואיכות חיים.</p><div class="quotation">״לא ניסינו לבחור בין קלאסי למודרני.<br/>יצרנו את המקום שבו שניהם מרגישים טבעיים יחד.״</div><div aria-hidden="true" class="arc-decoration"></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>03</span></div></article></template>
<template id="page-3"><article class="leaf-page fullbleedpage page-4" dir="rtl"><div class="page-content"><div class="full-bleed-photo"><img alt="החזית המערבית של C/M 10 בשעת ערב" data-photo="west_evening"/></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>04</span></div></article></template>
<template id="page-4"><article class="leaf-page paper page-5 architecture-text-page" dir="rtl"><div class="page-content"><div class="editorial architecture"><div class="eyebrow"><span class="little-line"></span>02 · האדריכלות</div><h2 class="display">יופי שנשאר<br/><em>רלוונטי לאורך זמן.</em></h2><p class="lead">פרשנות עכשווית לאלגנטיות האירופאית של פעם, עם נוכחות חזותית חזקה וחומריות אלגנטית.</p><p class="body-copy">האדריכלות של C/M 10 מחברת בין שפה אירופאית קלאסית לבין קווים נקיים של היום. כרכובים ופרטים אדריכליים עדינים, חלונות גבוהים, מעקות ומחיצות מרפסת מעוצבים — כולם חלק משפה אחת.</p><p class="small-copy">הפרופורציות המוקפדות, השילוב בין קלאסי לעכשווי והקווים המעוגלים מעניקים לבניין זהות אדריכלית שקטה אך בלתי נשכחת.</p><div aria-hidden="true" class="arc-decoration"></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>05</span></div></article></template>
<template id="page-5"><article class="leaf-page paper page-6" dir="rtl"><div class="page-content"><div class="editorial specs-page"><div class="eyebrow"><span class="little-line"></span>03 · הפרטים האדריכליים</div><h2 class="display">הפרטים שמייצרים<br/><em>את ההבדל.</em></h2><p class="lead">יופי שמתחיל בחזית וממשיך אל תוך הבניין.</p><div class="spec-list"><div class="spec-row"><div class="spec-dot">✦</div><div><b>חזית בעלת זהות</b><span>פרופורציות ניאו־קלאסיות ופרטים עכשוויים באותה שפה אדריכלית.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>מרפסות כחלק מהקומפוזיציה</b><span>מעקות ומחיצות המתחברים באופן טבעי לעיצוב החזית.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>חומרים נבחרים</b><span>שילוב בין אסתטיקה, עמידות וחשיבה על תחזוקה לטווח ארוך.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>תאורה אדריכלית</b><span>תכנון המדגיש בערב את המקצב, העומק והפרטים של המבנה.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>חלונות גבוהים</b><span>אור טבעי, תחושת מרחב וזיגוג תלת־שכבתי מתוכנן.</span></div></div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>06</span></div></article></template>
<template id="page-6"><article class="leaf-page photopage page-6 page-7" dir="rtl"><div class="page-content"><div class="photo-layout"><div class="photo-edge"></div><div class="photo-frame"><img alt="הדמיית החזית הדרומית של C/M 10 באור יום" data-photo="south_day"/></div><div class="photo-caption"><div class="photo-title-hebrew"><h2>האדריכלות באור יום</h2></div><p>חלונות גבוהים, קצב חזית מאוזן ומפגש עדין בין הקלאסי לעכשווי.</p><div class="photo-bottom-logo"><svg aria-label="C/M 10" class="cm-logo mini-logo" direction="ltr" height="64" role="img" viewBox="0 0 113 148" width="72" xmlns="http://www.w3.org/2000/svg"><g><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="77" font-weight="400" letter-spacing="-6" x="16" y="77">C</text><path d="M34 113 L77 25" fill="none" stroke="#c59a56" stroke-linecap="square" stroke-width="1.4"></path><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="75" font-weight="400" letter-spacing="-7" x="44" y="118">M</text><text fill="#c59a56" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="19" font-weight="400" x="17" y="133">10</text></g></svg></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>07</span></div></article></template>
<template id="page-7"><article class="leaf-page paper page-8 apartment-visual-page apartment-visual-fill" dir="rtl"><div class="page-content"><div class="editorial apartments apartment-visual"><div class="eyebrow"><span class="little-line"></span>04 · סביבת המגורים</div><h2 class="display">הדירה.<br/><em>העולם הפרטי שלך.</em></h2><p class="lead">תכנון מוקפד שנועד להתאים לאנשים שונים ולסגנונות חיים מגוונים — עכשיו גם בהמחשה תלת־ממדית והדמיית פנים.</p><div class="number-grid compact top-grid"><div><strong>34</strong><span>דירות בפרויקט בוטיק</span></div><div><strong>2.70</strong><span>מ׳ גובה תקרה בקירוב</span></div><div><strong>03</strong><span>דירות פנטהאוז בעלות חלל גבוה</span></div><div><strong>03</strong><span>דירות רגילות בעלות חלל גבוה</span></div></div><div class="apartment-layout fill-page"><div class="apartment-main"><img alt="מבט מהכניסה אל הסלון בעיצוב אירופאי קלאסי" data-photo="apartment_styled"/><div class="apartment-caption overlay"><strong>מבט מהכניסה אל אזור המגורים</strong><span>עיצוב אירופאי קלאסי, חלל ציבורי פתוח ומרפסת עם המעקה האדריכלי של הפרויקט.</span></div></div><div class="apartment-inset small-inset"><img alt="הדמיה תלת ממדית של תוכנית הדירה" data-photo="apartment_iso"/><div class="apartment-inset-label">המחשה תלת־ממדית של תכנית הדירה</div></div></div></div></div><div class="page-foot over-photo"><span>C/M 10 · ŁÓDŹ</span><span>08</span></div></article></template>
<template id="page-8"><article class="leaf-page paper page-9" dir="rtl"><div class="page-content"><div class="editorial specs-page"><div class="eyebrow"><span class="little-line"></span>05 · מפרט הדירות</div><h2 class="display">מאחורי כל חלל יפה<br/><em>יש תכנון חכם.</em></h2><p class="lead">תשתיות שנבחרות כבר בשלב התכנון, כדי לאפשר נוחות בעתיד.</p><div class="spec-list"><div class="spec-row"><div class="spec-dot">✦</div><div><b>גמישות בתכנון הפנימי</b><span>תכנון פרטני ותשתית המתחשבת בשינויים לפי בחירת הדייר.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>מרפסות פרטיות</b><span>חיבור אישי בין מרחב המגורים לבין העיר.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>דירות בעלות חלל גבוה</b><span>שלוש דירות בעלות פוטנציאל לעיצוב ולפתרונות חלוקה ייחודיים.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>פנטהאוזים מיוחדים</b><span>שלוש דירות פנטהאוז עם חלל גבוה ושטחי מרפסות.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>בקרת אקלים</b><span>מערכות חימום, חימום תת־רצפתי והכנה למיזוג, בכפוף למפרט הסופי.</span></div></div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>09</span></div></article></template>

<template id="page-11"><article class="leaf-page paper page-12" dir="rtl"><div class="page-content"><div class="editorial lobby"><div class="eyebrow"><span class="little-line"></span>07 · הלובי והשטחים המשותפים</div><h2 class="display">קבלת פנים<br/><em>שהיא חלק מהבית.</em></h2><p class="lead">החוויה מתחילה עוד לפני שנכנסים לדירה.</p><p class="body-copy">בבניין מתוכננים שני חללי לובי: לובי מרכזי לדיירים ולאורחים מהכניסה הראשית ולובי נוסף המשרת את המגיעים מהחניון. שניהם ממשיכים פנימה את השפה האלגנטית של הבניין.</p><div class="lobby-grid"><div><span>01</span><b>פינת ישיבה</b><p>חלל נעים למפגש קצר או להמתנה.</p></div><div><span>02</span><b>אמנות וחומרים</b><p>אלמנטים דקורטיביים ותאורה כחלק מהעיצוב.</p></div><div><span>03</span><b>שפה אחידה</b><p>שילוט, מספרי דירות ו־Wayfinding כחלק מזהות הפרויקט.</p></div><div><span>04</span><b>תכנון מוקפד</b><p>מסדרונות ושטחים משותפים המתכתבים עם הקונספט.</p></div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>12</span></div></article></template>
<template id="page-12"><article class="leaf-page paper page-13" dir="rtl"><div class="page-content"><div class="editorial specs-page"><div class="eyebrow"><span class="little-line"></span>08 · נוחות יומיומית</div><h2 class="display">יוקרה שנמצאת<br/><em>גם בפרקטיקה.</em></h2><p class="lead">פתרונות קטנים שמייצרים חוויית מגורים שלמה.</p><div class="giant-word" dir="ltr">EVERYDAY<br/>COMFORT</div><div class="spec-list"><div class="spec-row"><div class="spec-dot">✦</div><div><b>משלוחים חכמים</b><span>תיבות Parcel / Delivery Lockers המופעלות מרחוק באמצעות הטלפון.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>מעלית שקטה ומהירה</b><span>מעלית מודרנית בהתאם לתקני הבטיחות.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>נגישות</b><span>פתרונות המותאמים לאנשים עם מוגבלות בניידות.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>חניה מקורה</b><span>חניון סגור ומאובטח, לצד פתרונות לטעינת רכב חשמלי.</span></div></div><div class="spec-row"><div class="spec-dot">✦</div><div><b>אופניים</b><span>פתרונות אחסון חכמים, בהתאם לתכנון הסופי.</span></div></div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>13</span></div></article></template>
<template id="page-13"><article class="leaf-page paper page-14" dir="rtl"><div class="page-content"><div class="editorial secure"><div class="eyebrow"><span class="little-line"></span>09 · ביטחון ואחריות</div><h2 class="display">שקט נפשי.<br/><em>כבר בתכנון.</em></h2><p class="lead">תפיסת מגורים המתייחסת לנוחות, לביטחון ולסביבת החיים כשלם אחד.</p><div class="security-card"><span class="feature-no">01 / SECURITY</span><h3>בקרת כניסה</h3><p>מערכת דלתות ומנעולים בטכנולוגיה מתקדמת, מצלמות אבטחה ואינטרקום ויזואלי.</p></div><div class="security-card"><span class="feature-no">02 / PROTECTION</span><h3>מרחב מוגן בקומות</h3><p>מתוכנן אזור מוגן בכל קומה, עם מעטפת מגן, דלתות מתאימות ואוורור לשהייה ממושכת, בהתאם לתכנון ולאישורים הנדרשים.</p></div><div class="security-card"><span class="feature-no">03 / GREENERY</span><h3>קצת טבע בתוך העיר</h3><p>שטחים ירוקים בקומת הקרקע וגג ירוק, כחלק מסביבת המגורים.</p></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>14</span></div></article></template>
<template id="page-14"><article class="leaf-page paper page-14 page-15" dir="rtl"><div class="page-content"><div class="editorial location"><div class="eyebrow"><span class="little-line"></span>10 · המיקום</div><h2 class="display">לחיות בעיר.<br/><em>להרגיש בבית.</em></h2><p class="lead">Cmentarna 10, Łódź — מפגש בין העיר בעלת האופי לבין העתיד המתחדש שלה.</p><p class="body-copy">C/M 10 מאפשר ליהנות מהקרבה למסחר, תרבות, בילוי, פארקים ותחבורה — ובאותה עת לחזור לבניין בוטיק אינטימי בעל זהות משלו.</p><div class="place-banner rainbow-banner"><span>ŁÓDŹ</span><strong>CMENTARNA 10</strong><i>AN URBAN ADDRESS</i></div><p class="body-copy">לא רחוק מהפרויקט נמצאת Manufaktura, אחד מסמליה המוכרים של Łódź, שממחיש את החיבור בין המורשת התעשייתית של העיר לבין החיים החדשים שנוצרו בה.</p><p class="small-copy">הנגישות התחבורתית באזור, לרבות סביבת Łódź Polesie, מחברת את הפרויקט למרקם העירוני הרחב.</p></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>15</span></div></article></template>
<template id="page-15"><article class="leaf-page mappage page-map map-with-copy" dir="rtl"><div class="page-content"><div class="map-content-wrap"><div class="map-visual"><img alt="מפת הסביבה של C/M 10" data-photo="project_map"/></div><div class="map-copy"><div class="map-copy-title">שני מהלכים שמשנים את משמעות המיקום</div><div class="map-copy-grid"><section class="map-story rail-story"><div class="story-no">01</div><div><h3>Łódź Polesie — חיבור חדש לעיר ולרשת הרכבות הארצית</h3><p>בסמוך לפרויקט מוקמת תחנת <b>Łódź Polesie</b>, כחלק ממנהרת הרכבת החוצה את מרכז Łódź ומחברת את Łódź Fabryczna עם Łódź Kaliska ו־Łódź Żabieniec. עם השלמת המערכת, Łódź Fabryczna תהפוך מתחנת קצה לתחנת מעבר, ורכבות אזוריות ובינעירוניות יוכלו לחצות את מרכז העיר בצירי מזרח–מערב וצפון–דרום. לפי PKP PLK, Polesie מיועדת להיות אחד מצמתי התחבורה החשובים באגלומרטיה — חיבור שיחזק את הנגישות מהפרויקט אל מרכז העיר ואל רשת הרכבות הארצית.</p></div></section><section class="map-story renewal-story"><div class="story-no">02</div><div><h3>התחדשות עירונית בהיקף של יותר מרבע מיליארד זלוטי בסביבה הקרובה</h3><p>רחוב <b>Cmentarna</b> נכלל ישירות ב־<b>Project 7</b> של תכנית ההתחדשות העירונית של מרכז Łódź, בהיקף של כ־<b>193.7 מיליון PLN</b>. הפרויקט כולל שיקום מבנים, רחובות ומרחבים ציבוריים — ובכלל זה Cmentarna והרחובות הסמוכים. יחד עם <b>Project 8</b> הצמוד, היקף ההשקעה באזור עולה על <b>259 מיליון PLN</b>. המשמעות היא שדרוג מתמשך של המרחב הציבורי, איכות הרחובות וההליכה, הנראות העירונית והאטרקטיביות של הסביבה למגורים, מסחר ושירותים.</p></div></section></div><div class="map-note">* פרויקט הרכבת נמצא עדיין בביצוע; הניסוח מתייחס לתפקוד המתוכנן עם השלמתו. נתוני ההתחדשות מבוססים על פרסומי עיריית Łódź.</div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>16</span></div></article></template>
<template id="page-16"><article class="leaf-page paper page-17" dir="rtl"><div class="page-content"><div class="editorial value"><div class="eyebrow"><span class="little-line"></span>12 · הערך לאורך זמן</div><h2 class="display">ערך אמיתי<br/><em>לא נמדד רק במחיר למ״ר.</em></h2><p class="lead">הוא נוצר מהדרך שבה אדריכלות, חומרים, תכנון ומיקום פועלים יחד.</p><div class="value-cloud"><span>איכות התכנון</span><span>חומרים</span><span>פרופורציות</span><span>פונקציונליות</span><span>תחזוקה</span><span>שטחים משותפים</span><span>מיקום</span><span>חוויה לאורך שנים</span></div><div class="fine-rule"></div><p class="body-copy">הבחירות ב־C/M 10 נעשות מתוך הסתכלות ארוכת טווח: איך ייראה הבניין, כיצד יתפקד וכיצד ירגיש גם שנים אחרי האכלוס.</p><div class="quotation">״כתובת טובה אינה נמדדת רק במה שנמצא סביבה היום, אלא גם בכיוון שאליו הסביבה הולכת.״</div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>17</span></div></article></template>
<template id="page-17"><article class="leaf-page paper page-18" dir="rtl"><div class="page-content"><div class="editorial technical"><div class="eyebrow"><span class="little-line"></span>13 · המעטפת והסביבה</div><h2 class="display">בחירות מדויקות.<br/><em>איכות שממשיכה הלאה.</em></h2><p class="lead">תכנון החזית והמערכות מתוך מחשבה על העמידות והתחזוקה של המחר.</p><div class="tech-box"><div><span class="feature-no">A</span><h3>מעטפת תרמית</h3><p>חומרי בידוד תרמי איכותיים, מתוך מחשבה על יעילות אנרגטית ונוחות לאורך השנה, בהתאם לתקנים החלים ולמפרט הסופי.</p></div><div><span class="feature-no">B</span><h3>זיגוג תלת־שכבתי</h3><p>חלונות גבוהים שתורמים לתחושת האור והמרחב, לצד שיפור בידוד תרמי ואקוסטי.</p></div><div><span class="feature-no">C</span><h3>תחזוקה מראש</h3><p>חומרים, מערכות ופתרונות תפעוליים הנבחנים לא רק ליום המסירה אלא גם לשנים הבאות.</p></div></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>18</span></div></article></template>
<template id="page-18"><article class="leaf-page photopage page-18 page-19" dir="rtl"><div class="page-content"><div class="photo-layout"><div class="photo-edge"></div><div class="photo-frame"><img alt="הדמיית החזית הדרומית של C/M 10 בשעת ערב" data-photo="south_evening"/></div><div class="photo-caption"><div class="photo-title-hebrew"><h2>שעת הזהב</h2></div><p>בשעות אחר הצהריים, התאורה הטבעית מתחילה לפגוש את התאורה האדריכלית.</p><div class="photo-bottom-logo"><svg aria-label="C/M 10" class="cm-logo mini-logo" direction="ltr" height="64" role="img" viewBox="0 0 113 148" width="72" xmlns="http://www.w3.org/2000/svg"><g><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="77" font-weight="400" letter-spacing="-6" x="16" y="77">C</text><path d="M34 113 L77 25" fill="none" stroke="#c59a56" stroke-linecap="square" stroke-width="1.4"></path><text fill="#aa8351" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="75" font-weight="400" letter-spacing="-7" x="44" y="118">M</text><text fill="#c59a56" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="19" font-weight="400" x="17" y="133">10</text></g></svg></div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>19</span></div></article></template>
<template id="page-19"><article class="leaf-page paper page-19 page-20" dir="rtl"><div class="page-content"><div class="editorial close-editorial"><div class="eyebrow"><span class="little-line"></span>14 · הסטנדרט של C/M 10</div><h2 class="display">לא פריט יקר אחד.<br/><em>עשרות החלטות נכונות.</em></h2><p class="lead">הפרימיום אינו רק מה שרואים — הוא גם מה שמרגישים לאורך הדרך.</p><p class="body-copy">הפרויקט הוא הצטברות של החלטות אדריכליות, תכנוניות, טכנולוגיות ועיצוביות, שכולן מדברות בשפה אחת. הפרטיות של בניין בוטיק, חזית מוקפדת, דירות גמישות, שני חללי לובי, מערכות חכמות, ביטחון, שטחים ירוקים ומיקום עירוני.</p><div class="closing-medallion"><div class="medallion-logo-wrap"><svg aria-label="C/M 10" class="medallion-logo" direction="ltr" role="img" viewBox="0 0 113 148" xmlns="http://www.w3.org/2000/svg"><g><text fill="#8a6c4c" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="77" font-weight="400" letter-spacing="-6" x="16" y="77">C</text><path d="M34 113 L77 25" fill="none" stroke="#b18956" stroke-linecap="square" stroke-width="1.6"></path><text fill="#8a6c4c" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="75" font-weight="400" letter-spacing="-7" x="44" y="118">M</text><text fill="#b18956" font-family="Bodoni MT,Didot,Times New Roman,serif" font-size="19" font-weight="400" x="17" y="133">10</text></g></svg></div><span>THE DETAILS<br/>MAKE THE DIFFERENCE</span></div><div class="quotation">״לא הוספנו פרטים כדי ליצור רושם.<br/>יצרנו את הפרטים שעושים את ההבדל.״</div></div></div><div class="page-foot"><span>C/M 10 · ŁÓDŹ</span><span>20</span></div></article></template>

<div aria-hidden="true" class="print-pages" id="printPages"></div>
<script>
const PHOTOS={'season_spring':'assets/cm10_01_a46d4aa112.webp','season_summer':'assets/cm10_02_dab8bb718d.webp','season_autumn':'assets/cm10_03_dd27023d1c.webp','season_winter':'assets/cm10_04_1dc4572da3.webp','season_logo':'assets/cm10_05_9723fb4461.webp','seasons_collage':'assets/cm10_06_ff5c1c4067.webp','apartment_iso':'assets/cm10_07_b293f22fe3.webp','apartment_styled':'assets/cm10_08_170343a6fb.webp','project_map':'assets/cm10_09_c2c9ce3f4b.webp','cover_day':'assets/cm10_10_70ea11ded0.webp','west_evening':'assets/cm10_11_85c7d81634.webp','south_day':'assets/cm10_12_b45b3f690f.webp','north_evening':'assets/cm10_13_d9d72869e5.webp','south_evening':'assets/cm10_14_cd6bc9b566.webp'};
const PAGE_COUNT=22;
const SHEET_COUNT=PAGE_COUNT/2;
const book=document.getElementById('book'), bookSlot=document.getElementById('bookSlot'),mobileShell=document.getElementById('mobileShell');
const nextBtn=document.getElementById('next'),prevBtn=document.getElementById('prev');
const counter=document.getElementById('counter'),bar=document.getElementById('progress-bar');
let turn=0, mobileIndex=0, busy=false, mobileMode=window.matchMedia('(max-width:760px)').matches;
const sheets=[];
function clonePage(i){return document.getElementById(`page-${i}`).content.firstElementChild.cloneNode(true)}
function setPhotoSources(parent){parent.querySelectorAll('img[data-photo]').forEach(img=>{const photo=PHOTOS[img.dataset.photo];if(photo)img.src=photo})}
function buildSheets(){for(let i=0;i<SHEET_COUNT;i++){
  const sheet=document.createElement('div');sheet.className='sheet';sheet.setAttribute('aria-label',`גיליון ${i+1}`);
  const front=document.createElement('div');front.className='face front';front.append(clonePage(i*2));
  const back=document.createElement('div');back.className='face back';back.append(clonePage(i*2+1));
  sheet.append(front,back);book.append(sheet);sheets.push(sheet)
 }setPhotoSources(book);updateZ();}
function updateZ(){sheets.forEach((s,i)=>{s.style.zIndex = i<turn ? (SHEET_COUNT+4+i) : (SHEET_COUNT-i);s.classList.toggle('flipped',i<turn)})}
function visibleLabels(){if(mobileMode)return `עמוד ${mobileIndex+1} מתוך ${PAGE_COUNT}`;if(turn===0)return `כריכה · עמוד 1 מתוך ${PAGE_COUNT}`;if(turn===SHEET_COUNT)return `גב החוברת · עמוד ${PAGE_COUNT}`;return `עמודים ${turn*2}–${turn*2+1} מתוך ${PAGE_COUNT}`}
function syncUi(){counter.textContent=visibleLabels();bar.style.width=`${Math.round((mobileMode? mobileIndex/(PAGE_COUNT-1):turn/SHEET_COUNT)*100)}%`;prevBtn.disabled=mobileMode?mobileIndex===0:turn===0;nextBtn.disabled=mobileMode?mobileIndex===PAGE_COUNT-1:turn===SHEET_COUNT;}
function mobileShow(animate=false,direction=1){mobileShell.innerHTML='';const leaf=document.createElement('div');leaf.className='mobile-leaf'+(animate?(direction>0?' page-next':' page-prev'):'');leaf.append(clonePage(mobileIndex));mobileShell.append(leaf);setPhotoSources(mobileShell);syncUi()}
function navigate(delta){if(busy)return;if(mobileMode){const n=mobileIndex+delta;if(n<0||n>=PAGE_COUNT)return;mobileIndex=n;mobileShow(true,delta);return}const target=turn+delta;if(target<0||target>SHEET_COUNT)return;const s=sheets[delta>0?turn:turn-1];busy=true;s.classList.add('flipping');s.style.zIndex=SHEET_COUNT*4;turn=target;s.classList.toggle('flipped',delta>0);syncUi();setTimeout(()=>{s.classList.remove('flipping');updateZ();busy=false},1070)}
nextBtn.addEventListener('click',()=>navigate(1));prevBtn.addEventListener('click',()=>navigate(-1));
document.addEventListener('keydown',e=>{if(document.getElementById('toc').classList.contains('open')){if(e.key==='Escape')closeToc();return}if(e.key==='ArrowLeft'||e.key==='PageDown'){e.preventDefault();navigate(1)}if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();navigate(-1)}});

const dragArea=document.getElementById('stageArea');
let pageDrag=null;
function dragMetrics(){
  const el=mobileMode?mobileShell:bookSlot;
  const r=el.getBoundingClientRect();
  return {rect:r,center:r.left+r.width/2,pageW:mobileMode?r.width:r.width/2};
}
function dragStart(e){
  if(busy||e.button>0)return;
  const m=dragMetrics();
  if(e.clientX<m.rect.left||e.clientX>m.rect.right||e.clientY<m.rect.top||e.clientY>m.rect.bottom)return;
  if(mobileMode){
    pageDrag={mode:'mobile',startX:e.clientX,lastX:e.clientX,pointerId:e.pointerId};
    mobileShell.classList.add('page-dragging');
    mobileShell.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    return;
  }
  const onRight=e.clientX>=m.center;
  let dir=onRight?1:-1;
  if(dir===1&&turn>=SHEET_COUNT)return;
  if(dir===-1&&turn<=0)return;
  const sheet=dir===1?sheets[turn]:sheets[turn-1];
  sheet.classList.add('dragging');
  sheet.style.zIndex=SHEET_COUNT*5;
  sheet.style.transition='none';
  book.classList.add('page-dragging');
  bookSlot.setPointerCapture?.(e.pointerId);
  pageDrag={mode:'book',dir,sheet,startX:e.clientX,lastX:e.clientX,pointerId:e.pointerId,pageW:m.pageW,progress:0};
  e.preventDefault();
}
function dragMove(e){
  if(!pageDrag||e.pointerId!==pageDrag.pointerId)return;
  pageDrag.lastX=e.clientX;
  if(pageDrag.mode==='mobile'){
    const dx=e.clientX-pageDrag.startX;
    const leaf=mobileShell.querySelector('.mobile-leaf');
    if(leaf){
      const p=Math.min(1,Math.abs(dx)/Math.max(1,mobileShell.getBoundingClientRect().width));
      leaf.style.transition='none';
      leaf.style.transform=`perspective(1500px) translateX(${dx*.35}px) rotateY(${dx<0?-22*p:22*p}deg)`;
      leaf.style.opacity=`${1-.18*p}`;
    }
    e.preventDefault();return;
  }
  const d=pageDrag;
  const raw=d.dir===1?(d.startX-e.clientX):(e.clientX-d.startX);
  const p=Math.max(0,Math.min(1,raw/Math.max(1,d.pageW)));
  d.progress=p;
  const angle=d.dir===1?(-180*p):(-180+180*p);
  d.sheet.style.transform=`rotateY(${angle}deg)`;
  e.preventDefault();
}
function settleBookDrag(commit){
  const d=pageDrag;if(!d||d.mode!=='book')return;
  busy=true;
  d.sheet.style.transition='transform 560ms cubic-bezier(.22,.72,.22,1)';
  d.sheet.style.transform=d.dir===1?(commit?'rotateY(-180deg)':'rotateY(0deg)'):(commit?'rotateY(0deg)':'rotateY(-180deg)');
  setTimeout(()=>{
    if(commit){turn+=d.dir;d.sheet.classList.toggle('flipped',d.dir===1)}
    d.sheet.classList.remove('dragging');
    d.sheet.style.transition='';d.sheet.style.transform='';
    book.classList.remove('page-dragging');
    updateZ();syncUi();busy=false;pageDrag=null;
  },590);
}
function settleMobileDrag(commit,dir){
  const leaf=mobileShell.querySelector('.mobile-leaf');
  if(!leaf){pageDrag=null;return}
  leaf.style.transition='transform 280ms ease,opacity 280ms ease';
  if(commit){leaf.style.transform=`perspective(1500px) translateX(${dir>0?-85:85}%) rotateY(${dir>0?-35:35}deg)`;leaf.style.opacity='0';
    setTimeout(()=>{mobileIndex+=dir;pageDrag=null;mobileShell.classList.remove('page-dragging');mobileShow(true,dir)},285);
  }else{leaf.style.transform='perspective(1500px) translateX(0) rotateY(0deg)';leaf.style.opacity='1';setTimeout(()=>{leaf.style.transition='';leaf.style.transform='';leaf.style.opacity='';pageDrag=null;mobileShell.classList.remove('page-dragging')},285)}
}
function dragEnd(e){
  if(!pageDrag||e.pointerId!==pageDrag.pointerId)return;
  const dx=e.clientX-pageDrag.startX;
  const travel=Math.abs(dx);
  if(pageDrag.mode==='mobile'){
    let dir=dx<0?1:-1;
    const can=(dir===1?mobileIndex<PAGE_COUNT-1:mobileIndex>0);
    settleMobileDrag(can&&travel>48,dir);
    e.preventDefault();return;
  }
  const d=pageDrag;
  const intended=d.dir===1?dx<0:dx>0;
  const clickLike=travel<10;
  const commit=(intended&&(d.progress>.18||travel>54))||clickLike;
  settleBookDrag(commit);
  e.preventDefault();
}
function dragCancel(e){
  if(!pageDrag)return;
  if(pageDrag.mode==='book')settleBookDrag(false);else settleMobileDrag(false,1);
}
bookSlot.addEventListener('pointerdown',dragStart,{passive:false});
bookSlot.addEventListener('pointermove',dragMove,{passive:false});
bookSlot.addEventListener('pointerup',dragEnd,{passive:false});
bookSlot.addEventListener('pointercancel',dragCancel,{passive:false});
mobileShell.addEventListener('pointerdown',dragStart,{passive:false});
mobileShell.addEventListener('pointermove',dragMove,{passive:false});
mobileShell.addEventListener('pointerup',dragEnd,{passive:false});
mobileShell.addEventListener('pointercancel',dragCancel,{passive:false});

function fitStage(){const screen=window.innerWidth;const mob=screen<=760;if(mob!==mobileMode){if(mob){mobileIndex=Math.min(PAGE_COUNT-1,turn?2*turn-1:0)}else{turn=Math.ceil(mobileIndex/2);updateZ()}mobileMode=mob;mobileShow()}
 const w=mob?540:1080,h=735;const topbar=document.querySelector('.topbar').getBoundingClientRect().height;const bottom=document.querySelector('.navbar').getBoundingClientRect().height+20;const availableH=Math.max(280,window.innerHeight-topbar-bottom-12);const availW=Math.max(280,screen-(mob?14:42));const scale=Math.min(1,availW/w,availableH/h);const slot=mob?mobileShell:bookSlot;slot.style.transform=`scale(${scale})`;const area=document.getElementById('stageArea');area.style.height=`${Math.floor(h*scale)+4}px`;area.style.minHeight=`${Math.floor(h*scale)+4}px`;syncUi()}
window.addEventListener('resize',fitStage);
const toc=document.getElementById('toc');function openToc(){toc.classList.add('open');toc.setAttribute('aria-hidden','false')};function closeToc(){toc.classList.remove('open');toc.setAttribute('aria-hidden','true')};
document.getElementById('tocOpen').onclick=openToc;document.getElementById('tocClose').onclick=closeToc;
toc.onclick=(e)=>{if(e.target===toc)closeToc()};document.querySelectorAll('.toc-item').forEach(b=>b.onclick=()=>{const p=+b.dataset.page;if(mobileMode){mobileIndex=p;mobileShow(true,1)}else{turn=Math.ceil(p/2);updateZ();syncUi()}closeToc()});
document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});
const printRoot=document.getElementById('printPages');for(let i=0;i<PAGE_COUNT;i++){printRoot.append(clonePage(i))};setPhotoSources(printRoot);buildSheets();mobileShow();fitStage();window.bookReady=true;
</script></body></html>
